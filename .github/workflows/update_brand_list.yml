name: Update Bucketstore brand list

on:
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Crawl brand list
        run: python scripts/update_brand_list.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- bucketstore_brand_list.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add bucketstore_brand_list.json
          git commit -m "Update brand list ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git push
